name: Audio pitch regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  apu-pitch:
    name: APU pitch / Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          target: x86_64-pc-windows-msvc
      - name: Prepare pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path third_party -Force | Out-Null
          git clone https://github.com/marianodparisi/xboxrecomp.git third_party/xboxrecomp
          if ($LASTEXITCODE -ne 0) { throw 'Runtime clone failed' }
          git -C third_party/xboxrecomp checkout --detach 766ecefcd7fb2a9b344de8ec891f6fe9ea14261b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned checkout failed' }
          git -C third_party/xboxrecomp apply --check "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch preflight failed' }
          git -C third_party/xboxrecomp apply "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch failed' }
      - name: Prepare pinned DSP56300 core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .work -Force | Out-Null
          git clone https://github.com/marianodparisi/dsp56300.git .work/err009-dsp56300
          if ($LASTEXITCODE -ne 0) { throw 'DSP56300 clone failed' }
          git -C .work/err009-dsp56300 checkout --detach aab3649fc452daf03da8b5e36fdc0c308d874101
          if ($LASTEXITCODE -ne 0) { throw 'Pinned DSP56300 checkout failed' }
      - name: Build APU library
        shell: pwsh
        run: |
          cmake -S third_party/xboxrecomp -B build-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime configure failed' }
          cmake --build build-runtime --config Release --target xbox_apu
          if ($LASTEXITCODE -ne 0) { throw 'APU build failed' }
      - name: Build and run regression
        shell: pwsh
        run: |
          cmake -S tests/apu_pitch -B build-apu-pitch -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-pitch --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration test build failed" }
            ctest --test-dir build-apu-pitch -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration regression failed" }
          }
      - name: Build and run audio clock and pacing regression
        shell: pwsh
        run: |
          cmake -S tests/apu_timing -B build-apu-timing -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Timing test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-timing --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration timing build failed" }
            ctest --test-dir build-apu-timing -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration timing regression failed" }
          }
      - name: Build and run audio output queue regression
        shell: pwsh
        run: |
          cmake -S tests/apu_output -B build-apu-output -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Output test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-output --config $configuration
            if ($LASTEXITCODE -ne 0) { throw "$configuration output build failed" }
            ctest --test-dir build-apu-output -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration output regression failed" }
          }
      - name: Build and run APU physical backing regression
        shell: pwsh
        run: |
          cmake -S tests/apu_physical_memory -B build-apu-physical-memory -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Physical backing test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-physical-memory --config $configuration --target apu-physical-memory-test
            if ($LASTEXITCODE -ne 0) { throw "$configuration physical backing build failed" }
            ctest --test-dir build-apu-physical-memory -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration physical backing regression failed" }
          }
      - name: Build and run spatial fallback regression
        shell: pwsh
        run: |
          cmake -S tests/apu_spatial -B build-apu-spatial -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Spatial test configure failed' }
          foreach ($configuration in 'Release', 'Debug') {
            cmake --build build-apu-spatial --config $configuration --target apu-spatial-test
            if ($LASTEXITCODE -ne 0) { throw "$configuration spatial test build failed" }
            ctest --test-dir build-apu-spatial -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw "$configuration spatial regression failed" }
          }
