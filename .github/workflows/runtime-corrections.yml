name: Runtime correction regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-corrections:
    name: Runtime corrections / Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          target: x86_64-pc-windows-msvc
      - name: Prepare pinned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path third_party -Force | Out-Null
          git clone https://github.com/marianodparisi/xboxrecomp.git third_party/xboxrecomp
          if ($LASTEXITCODE -ne 0) { throw 'Runtime clone failed' }
          git -C third_party/xboxrecomp checkout --detach 766ecefcd7fb2a9b344de8ec891f6fe9ea14261b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned checkout failed' }
          git -C third_party/xboxrecomp apply --check "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch preflight failed' }
          git -C third_party/xboxrecomp apply "$PWD/patches/xboxrecomp.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime patch failed' }
      - name: Prepare pinned DSP56300 core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .work -Force | Out-Null
          git clone https://github.com/marianodparisi/dsp56300.git .work/err009-dsp56300
          if ($LASTEXITCODE -ne 0) { throw 'DSP56300 clone failed' }
          git -C .work/err009-dsp56300 checkout --detach aab3649fc452daf03da8b5e36fdc0c308d874101
          if ($LASTEXITCODE -ne 0) { throw 'Pinned DSP56300 checkout failed' }
      - name: Build and run DSP core and DMA regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S third_party/xboxrecomp/tests/apu_dsp_core -B build-apu-dsp-core -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'DSP core test configure failed' }
          cmake --build build-apu-dsp-core --config Release
          if ($LASTEXITCODE -ne 0) { throw 'DSP core test build failed' }
          ctest --test-dir build-apu-dsp-core -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'DSP core regression failed' }
      - name: Build and run all mixbin regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S third_party/xboxrecomp/tests/apu_mixdown -B build-apu-mixdown -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'APU mixdown test configure failed' }
          cmake --build build-apu-mixdown --config Release
          if ($LASTEXITCODE -ne 0) { throw 'APU mixdown test build failed' }
          ctest --test-dir build-apu-mixdown -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'APU mixdown regression failed' }
      - name: Build and run launcher publication and settings regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build-launcher.ps1 -Force -OutputDirectory .work/launcher-publication
          if ($LASTEXITCODE -ne 0) { throw 'Launcher publication build failed' }
          ./tests/ambient_occlusion/test-launcher.ps1 -BuildDirectory .work/launcher-ambient-regressions
          if ($LASTEXITCODE -ne 0) { throw 'Launcher settings regression failed' }
          ./tests/launcher_language/test-direct-launch.ps1 -BuildDirectory .work/launcher-direct-regressions -LauncherDirectory .work/launcher-publication
          if ($LASTEXITCODE -ne 0) { throw 'Direct launcher regression failed' }
          ./tests/save_profile/test-save-profile.ps1 -BuildDirectory .work/launcher-save-profile-regressions
          if ($LASTEXITCODE -ne 0) { throw 'Save profile regression failed' }
      - name: Test generated-source audit and indirect-call feedback
        run: python scripts/test_generate.py
      - name: Test audio bank parsing and extraction boundaries
        run: python -m unittest discover -s scripts -p test_extract_audio.py -v
      - name: Build and run weapon diagnostic guards
        shell: pwsh
        run: |
          cmake -S tests/weapon_trace -B build-weapon-trace -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Weapon diagnostic configure failed' }
          cmake --build build-weapon-trace --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Weapon diagnostic build failed' }
          ctest --test-dir build-weapon-trace -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Weapon diagnostic regression failed' }
      - name: Build and run independent weapon runtime modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/weapon_runtime -B build-weapon-runtime -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Weapon runtime configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-weapon-runtime --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'Weapon runtime build failed' }
            ctest --test-dir build-weapon-runtime -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Weapon runtime regression failed' }
          }
      - name: Build and run first-person projection regressions
        shell: pwsh
        run: |
          cmake -S tests/viewmodel -B build-viewmodel -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Viewmodel test configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-viewmodel --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'Viewmodel test build failed' }
            ctest --test-dir build-viewmodel -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Viewmodel projection regression failed' }
          }
      - name: Build and run ultrawide scope mask regressions
        shell: pwsh
        run: |
          cmake -S tests/scope_mask -B build-scope-mask -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Scope mask test configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-scope-mask --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'Scope mask test build failed' }
            ctest --test-dir build-scope-mask -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Scope mask regression failed' }
          }
      - name: Build and run weapon model arithmetic and observation regressions
        shell: pwsh
        run: |
          foreach ($suite in @('weapon_model_math', 'weapon_model_trace')) {
            cmake -S "tests/$suite" -B "build-$suite" -G "Visual Studio 17 2022" -A x64
            if ($LASTEXITCODE -ne 0) { throw "$suite configure failed" }
            foreach ($configuration in @('Release', 'Debug')) {
              cmake --build "build-$suite" --config $configuration
              if ($LASTEXITCODE -ne 0) { throw "$suite $configuration build failed" }
              ctest --test-dir "build-$suite" -C $configuration --output-on-failure
              if ($LASTEXITCODE -ne 0) { throw "$suite $configuration regression failed" }
            }
          }
      - name: Build and run EEPROM regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/eeprom -B build-eeprom -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'EEPROM test configure failed' }
          cmake --build build-eeprom --config Release
          if ($LASTEXITCODE -ne 0) { throw 'EEPROM test build failed' }
          ctest --test-dir build-eeprom -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'EEPROM regression failed' }
      - name: Build and run kernel bridge regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S third_party/xboxrecomp/tests/kernel_bridge -B build-kernel-bridge -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Kernel bridge test configure failed' }
          cmake --build build-kernel-bridge --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Kernel bridge test build failed' }
          ctest --test-dir build-kernel-bridge -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Kernel bridge regression failed' }
      - name: Build and run BLACK audio completion regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/black_audio_completion -B build-black-audio-completion -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Audio completion configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-black-audio-completion --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'Audio completion build failed' }
            ctest --test-dir build-black-audio-completion -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Audio completion regression failed' }
          }
      - name: Build and run timer interrupt wait-set regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/kernel_timer_waitset -B build-kernel-timer-waitset -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Timer wait-set configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-kernel-timer-waitset --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'Timer wait-set build failed' }
            ctest --test-dir build-kernel-timer-waitset -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'Timer wait-set regression failed' }
          }
      - name: Build and run pending DPC concurrency regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S tests/kernel_dpc_queue -B build-kernel-dpc-queue -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'DPC queue configure failed' }
          foreach ($configuration in @('Release', 'Debug')) {
            cmake --build build-kernel-dpc-queue --config $configuration
            if ($LASTEXITCODE -ne 0) { throw 'DPC queue build failed' }
            ctest --test-dir build-kernel-dpc-queue -C $configuration --output-on-failure
            if ($LASTEXITCODE -ne 0) { throw 'DPC queue regression failed' }
          }
